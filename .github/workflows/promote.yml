name: Promote to stable
# A testing build becomes stable (T048): by hand with a tag, or every day by
# itself for the newest testing build that passed every part of its VM test
# and has been on testing for three days.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tested tag to release as stable (testing or testing-<version>)"
        default: testing
        required: true
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - name: Pick
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "${TAG}" ]; then echo "tag=${TAG}" >> "$GITHUB_OUTPUT"; exit 0; fi
          src=docker://ghcr.io/tenarkhq/arkadeos
          stable=$(skopeo inspect --format '{{ .Digest }}' "${src}:stable" 2>/dev/null || true)
          limit=$(date -u -d '3 days ago' +%s)
          # Newest first; a day's further builds end in .1, .2 … (build.yml).
          for tag in $(skopeo list-tags "${src}" | jq -r '.Tags[] | select(test("^testing-[0-9]+\\.[0-9]{8}(\\.[0-9]+)?$"))' | sort -rV); do
            info=$(skopeo inspect "${src}:${tag}")
            created=$(date -u -d "$(jq -r .Created <<< "${info}")" +%s)
            [ "${created}" -le "${limit}" ] || continue
            [ "$(jq -r .Digest <<< "${info}")" != "${stable}" ] || break
            rev=$(jq -r '.Labels["org.opencontainers.image.revision"]' <<< "${info}")
            # A run of every VM test part (" · all" in its job names; a push
            # runs only the parts its changes reach).
            passed=0
            for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/vm-test.yml/runs?head_sha=${rev}&status=success" --jq '.workflow_runs[].id'); do
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs" --jq '.jobs[].name' | grep -q ' · all$' && { passed=1; break; }
            done
            if [ "${passed}" -gt 0 ]; then
              echo "tag=${tag}" >> "$GITHUB_OUTPUT"
              echo "${tag} (${rev::7}): VM test passed, 3+ days on testing → stable" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "Nothing to promote: stable is the newest tested build." >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: pick
    if: needs.pick.outputs.tag != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [arkadeos, arkadeos-nvidia]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Retag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.pick.outputs.tag }}
        run: |
          # One image (T080): the arkadeos build, also under the former NVIDIA
          # image's name.
          from=ghcr.io/tenarkhq/arkadeos src=ghcr.io/tenarkhq/${{ matrix.image }}
          echo "$GITHUB_TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          digest=$(skopeo inspect --format '{{ .Digest }}' "docker://${from}:${TAG}")
          # Only a signed image becomes stable.
          cosign verify --key cosign.pub "${src}@${digest}" >/dev/null
          version=$(skopeo inspect --format '{{ index .Labels "org.opencontainers.image.version" }}' "docker://${from}@${digest}")
          for tag in stable stable-${version}; do
            skopeo copy --preserve-digests "docker://${from}@${digest}" "docker://${src}:${tag}"
          done
          echo "${src}@${digest} → stable, stable-${version}" >> "$GITHUB_STEP_SUMMARY"
