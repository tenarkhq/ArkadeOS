name: VM test
on:
  workflow_run:
    workflows: [Build images]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to test"
        default: testing
        required: true

permissions:
  contents: read
  packages: read

jobs:
  vm-test:
    name: ${{ matrix.image }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # GitHub-hosted: these machines have KVM, the build server does not.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [arkadeos, arkadeos-nvidia]
    env:
      IMAGE: ghcr.io/tenarkhq/${{ matrix.image }}:${{ inputs.tag || 'testing' }}
    steps:
      - uses: actions/checkout@v4

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm || true
          grep -c -E 'vmx|svm' /proc/cpuinfo || true
          test -w /dev/kvm || { echo "no KVM on this runner" >&2; exit 1; }

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 ovmf socat imagemagick dosfstools mtools btrfs-progs

      - name: Pull image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          start=$(date +%s)
          sudo podman pull -q "$IMAGE"
          echo "pull: $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"
          # The test reaches the VM over SSH, which ArkadeOS keeps off. The VM
          # installs from and updates through a registry on this runner
          # (127.0.0.1 here, 10.0.2.2 from inside the VM).
          printf '%s\n' "FROM $IMAGE" 'RUN systemctl enable sshd.service && mkdir -p /etc/containers/registries.conf.d && printf "[[registry]]\nlocation = \"%s\"\ninsecure = true\n" 127.0.0.1:5000 10.0.2.2:5000 > /etc/containers/registries.conf.d/50-vm-test.conf' |
            sudo podman build -q -t localhost/vm-test -f - .
          # T025: the update the VM pulls later: the same image plus a marker file.
          printf '%s\n' 'FROM localhost/vm-test' 'RUN echo vm-test-update > /usr/share/arkadeos/update-test' |
            sudo podman build -q -t localhost/vm-test-update -f - .

      - name: Local registry
        run: |
          start=$(date +%s)
          sudo podman run -d --name registry -p 127.0.0.1:5000:5000 docker.io/library/registry:2
          sudo podman push -q --tls-verify=false localhost/vm-test 127.0.0.1:5000/arkadeos:test
          echo "registry push: $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Disk image
        run: |
          ssh-keygen -q -t ed25519 -N '' -f vm-key
          start=$(date +%s)
          # The layout a real install gets: EFI, ext4 /boot, btrfs root.
          sudo tests/vm/make-disk.sh /mnt/disk.raw localhost/vm-test "$PWD/vm-key.pub" \
            registry:127.0.0.1:5000/arkadeos:test 10.0.2.2:5000/arkadeos:test
          sudo chown "$USER" /mnt/disk.raw
          echo "disk image: $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Boot, desktop, apps
        run: |
          start=$(date +%s)
          UPDATE_PUSH="sudo podman push -q --tls-verify=false localhost/vm-test-update 127.0.0.1:5000/arkadeos:test" \
            tests/vm/run.sh /mnt/disk.raw vm-key vm-out
          echo "VM test: $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-test-${{ matrix.image }}
          path: vm-out/
          if-no-files-found: ignore

  # T051: the previous build, installed and used, updates to this one without
  # reinstalling. One image is enough: both share everything but the driver.
  update-path:
    name: update path
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REPO: ghcr.io/tenarkhq/arkadeos
      TAG: ${{ inputs.tag || 'testing' }}
    steps:
      - uses: actions/checkout@v4

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -w /dev/kvm || { echo "no KVM on this runner" >&2; exit 1; }

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 ovmf socat imagemagick dosfstools btrfs-progs

      - name: Previous and new build
        id: builds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          new=$(sudo skopeo inspect --format '{{ .Digest }}' "docker://${REPO}:${TAG}")
          previous=
          for tag in $(sudo skopeo list-tags "docker://${REPO}" | jq -r '.Tags[] | select(test("^(testing|stable)-[0-9]+\\.[0-9]{8}$"))' | sort -t- -k2 -r); do
            digest=$(sudo skopeo inspect --format '{{ .Digest }}' "docker://${REPO}:${tag}")
            if [ "${digest}" != "${new}" ]; then previous=${tag}; break; fi
          done
          if [ -z "${previous}" ]; then
            echo "No previous build to update from." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "${REPO}:${previous} → ${REPO}:${TAG} (${new})" >> "$GITHUB_STEP_SUMMARY"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          for pair in "old ${REPO}:${previous}" "new ${REPO}@${new}"; do
            set -- ${pair}
            sudo podman pull -q "$2"
            printf '%s\n' "FROM $2" 'RUN systemctl enable sshd.service && mkdir -p /etc/containers/registries.conf.d && printf "[[registry]]\nlocation = \"%s\"\ninsecure = true\n" 127.0.0.1:5000 10.0.2.2:5000 > /etc/containers/registries.conf.d/50-vm-test.conf' |
              sudo podman build -q -t "localhost/vm-$1" -f - .
          done
          sudo podman run -d --name registry -p 127.0.0.1:5000:5000 docker.io/library/registry:2
          sudo podman push -q --tls-verify=false localhost/vm-old 127.0.0.1:5000/arkadeos:test
          sudo podman push -q --tls-verify=false localhost/vm-old "127.0.0.1:5000/arkadeos:${previous}"

      - name: Disk image (previous build)
        if: steps.builds.outputs.skip != 'true'
        run: |
          ssh-keygen -q -t ed25519 -N '' -f vm-key
          sudo tests/vm/make-disk.sh /mnt/disk.raw localhost/vm-old "$PWD/vm-key.pub" \
            registry:127.0.0.1:5000/arkadeos:test 10.0.2.2:5000/arkadeos:test
          sudo chown "$USER" /mnt/disk.raw

      - name: Update to the new build
        if: steps.builds.outputs.skip != 'true'
        run: |
          tests/vm/update-path.sh /mnt/disk.raw vm-key vm-out \
            "sudo podman push -q --tls-verify=false localhost/vm-new 127.0.0.1:5000/arkadeos:test" \
            "${{ steps.builds.outputs.previous }}"

      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-test-update-path
          path: vm-out/
          if-no-files-found: ignore
