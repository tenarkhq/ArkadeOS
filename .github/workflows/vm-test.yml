name: VM test
# After a push only the test parts the changes reach run (tests/vm/groups.sh);
# the nightly build, a base update and a run by hand run all of them.
on:
  workflow_run:
    workflows: [Build images]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to test"
        default: testing
        required: true

permissions:
  contents: read
  packages: read

jobs:
  scope:
    name: parts to test
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      groups: ${{ steps.parts.outputs.groups }}
      half1: ${{ steps.parts.outputs.half1 }}
      half2: ${{ steps.parts.outputs.half2 }}
      skip: ${{ steps.parts.outputs.skip }}
      tag: ${{ steps.parts.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Parts
        id: parts
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event.workflow_run.event || github.event_name }}
          # The tested build: a main build's own tag (build.yml), or the one
          # given by hand.
          TAG: ${{ inputs.tag || format('build-{0}', github.event.workflow_run.head_sha) }}
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          groups=all
          if [ "${EVENT}" = schedule ]; then
            # A nightly run without a new build (build.yml): nothing to test
            # again when this commit already passed every part.
            for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/vm-test.yml/runs?status=success&head_sha=$(git rev-parse HEAD)" --jq '.workflow_runs[].id'); do
              if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs" --jq '.jobs[].name' | grep -q ' · all$' &&
                [ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" --jq .created_at)" \> "$(skopeo inspect --no-tags "docker://ghcr.io/tenarkhq/arkadeos:${TAG}" | jq -r .Created)" ]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "This build already passed every part." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            done
          fi
          if [ "${EVENT}" = push ]; then
            # The changes since the newest commit that passed every part.
            from=
            for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/vm-test.yml/runs?status=success&per_page=30" --jq '.workflow_runs[].id'); do
              if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs" --jq '.jobs[].name' | grep -q ' · all$'; then
                from=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" --jq .head_sha)
                break
              fi
            done
            if [ -n "${from}" ] && git merge-base --is-ancestor "${from}" HEAD; then
              groups=$(tests/vm/groups.sh "${from}" HEAD)
              echo "changes since ${from::7}: ${groups}" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "parts: ${groups}" >> "$GITHUB_STEP_SUMMARY"
          echo "groups=${groups}" >> "$GITHUB_OUTPUT"
          # The main run is split over two VMs that run side by side; the base
          # (boot, login, desktop, security) runs on both.
          half() {
            local out= g
            for g in $1; do
              [[ ",${groups}," == *,all,* || ",${groups}," == *",${g},"* ]] && out=${out:+${out},}${g}
            done
            echo "${out:-none}"
          }
          echo "half1=$(half 'look keys power games')" >> "$GITHUB_OUTPUT"
          echo "half2=$(half 'apps update')" >> "$GITHUB_OUTPUT"

  vm-test:
    # The parts in the name: promote.yml takes a build to stable only after a
    # run of every part (" · all").
    name: arkadeos${{ matrix.suite == 'choices' && ' choices' || format(' {0}/2', matrix.half) }} · ${{ needs.scope.outputs.groups }}
    needs: scope
    if: needs.scope.outputs.skip != 'true'
    # GitHub-hosted: these machines have KVM, the build server does not.
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.suite == 'choices' && 90 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        # run: the desktop and everything in the image, its parts in two
        # halves on two VMs. choices: the parts picked in the Portal (T019,
        # T020, T035), installed and tried.
        include:
          - { suite: run, half: 1 }
          - { suite: run, half: 2 }
          - { suite: choices }
    env:
      IMAGE: ghcr.io/tenarkhq/arkadeos:${{ needs.scope.outputs.tag }}
      TEST_GROUPS: ${{ matrix.half == 2 && needs.scope.outputs.half2 || matrix.half == 1 && needs.scope.outputs.half1 || needs.scope.outputs.groups }}
      # The second half and the Portal-picked parts only when the changes
      # reach them; the first half always (the base).
      NEEDED: ${{ matrix.half == 1 || (matrix.half == 2 && needs.scope.outputs.half2 != 'none') || (matrix.suite == 'choices' && (contains(format(',{0},', needs.scope.outputs.groups), ',all,') || contains(format(',{0},', needs.scope.outputs.groups), ',choices,'))) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.NEEDED == 'true'

      - name: KVM
        if: env.NEEDED == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm || true
          grep -c -E 'vmx|svm' /proc/cpuinfo || true
          test -w /dev/kvm || { echo "no KVM on this runner" >&2; exit 1; }

      - name: Room on the disk
        if: env.NEEDED == 'true'
        # The image unpacks to well over 10 GB and the VM disk takes about as
        # much: the unused SDKs always go (a runner with 108 GB free still ran
        # out of room on 11-03 without it).
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h / /mnt

      - name: Tools
        if: env.NEEDED == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 ovmf socat imagemagick dosfstools mtools btrfs-progs grub-efi-amd64-bin

      - name: Pull image
        if: env.NEEDED == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          start=$(date +%s)
          sudo podman pull -q "$IMAGE"
          # The runner died out of room on 11-03 and took its log with it; each
          # finished step's summary stays, so the room left after each big step shows
          # where it goes.
          echo "pull: $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"
          echo "free after it: $(df -h --output=avail / | tail -1) on /, $(df -h --output=avail /mnt | tail -1) on /mnt" >> "$GITHUB_STEP_SUMMARY"
          # The test reaches the VM over SSH, which ArkadeOS keeps off. The VM
          # installs from and updates through a registry on this runner
          # (127.0.0.1 here, 10.0.2.2 from inside the VM).
          printf '%s\n' "FROM $IMAGE" 'RUN systemctl enable sshd.service && mkdir -p /etc/containers/registries.conf.d && printf "[[registry]]\nlocation = \"%s\"\ninsecure = true\n" 127.0.0.1:5000 10.0.2.2:5000 > /etc/containers/registries.conf.d/50-vm-test.conf' |
            sudo podman build -q -t localhost/vm-test -f - .
          # T025: the update the VM pulls later: the same image plus a marker file.
          printf '%s\n' 'FROM localhost/vm-test' 'RUN echo vm-test-update > /usr/share/arkadeos/update-test' |
            sudo podman build -q -t localhost/vm-test-update -f - .

      - name: Local registry
        if: env.NEEDED == 'true'
        run: |
          start=$(date +%s)
          sudo podman run -d --name registry -p 127.0.0.1:5000:5000 docker.io/library/registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          sudo podman push -q --tls-verify=false localhost/vm-test 127.0.0.1:5000/arkadeos:test
          echo "registry push: $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"
          echo "free after it: $(df -h --output=avail / | tail -1) on /, $(df -h --output=avail /mnt | tail -1) on /mnt" >> "$GITHUB_STEP_SUMMARY"

      - name: Disk image
        if: env.NEEDED == 'true'
        run: |
          ssh-keygen -q -t ed25519 -N '' -f vm-key
          start=$(date +%s)
          # The layout a real install gets: EFI, ext4 /boot, btrfs root.
          sudo tests/vm/make-disk.sh /mnt/disk.raw localhost/vm-test "$PWD/vm-key.pub" \
            registry:127.0.0.1:5000/arkadeos:test 10.0.2.2:5000/arkadeos:test
          sudo chown "$USER" /mnt/disk.raw
          echo "disk image: $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"
          echo "free after it: $(df -h --output=avail / | tail -1) on /, $(df -h --output=avail /mnt | tail -1) on /mnt" >> "$GITHUB_STEP_SUMMARY"

      - name: Boot, desktop, apps
        if: matrix.suite == 'run'
        run: |
          start=$(date +%s)
          UPDATE_PUSH="sudo podman push -q --tls-verify=false localhost/vm-test-update 127.0.0.1:5000/arkadeos:test" \
            tests/vm/run.sh /mnt/disk.raw vm-key vm-out
          echo "VM test: $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Chosen parts
        if: matrix.suite == 'choices' && env.NEEDED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start=$(date +%s)
          tests/vm/choices.sh /mnt/disk.raw vm-key vm-out
          echo "choices: $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-test-arkadeos${{ matrix.suite == 'choices' && '-choices' || format('-{0}', matrix.half) }}
          path: vm-out/
          if-no-files-found: ignore

  # T051: the previous build, installed and used, updates to this one without
  # reinstalling. One image is enough: both share everything but the driver.
  update-path:
    name: update path
    needs: scope
    if: needs.scope.outputs.skip != 'true' && (contains(format(',{0},', needs.scope.outputs.groups), ',all,') || contains(format(',{0},', needs.scope.outputs.groups), ',update-path,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REPO: ghcr.io/tenarkhq/arkadeos
      TAG: ${{ needs.scope.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -w /dev/kvm || { echo "no KVM on this runner" >&2; exit 1; }

      - name: Room on the disk
        # The image unpacks to well over 10 GB and the VM disk takes about as
        # much: the unused SDKs always go (a runner with 108 GB free still ran
        # out of room on 11-03 without it).
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h / /mnt

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 ovmf socat imagemagick dosfstools btrfs-progs

      - name: Previous and new build
        id: builds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          new=$(sudo skopeo inspect --format '{{ .Digest }}' "docker://${REPO}:${TAG}")
          previous=
          for tag in $(sudo skopeo list-tags "docker://${REPO}" | jq -r '.Tags[] | select(test("^(testing|stable)-[0-9]+\\.[0-9]{8}$"))' | sort -t- -k2 -r); do
            digest=$(sudo skopeo inspect --format '{{ .Digest }}' "docker://${REPO}:${tag}")
            if [ "${digest}" != "${new}" ]; then previous=${tag}; break; fi
          done
          if [ -z "${previous}" ]; then
            echo "No previous build to update from." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "${REPO}:${previous} → ${REPO}:${TAG} (${new})" >> "$GITHUB_STEP_SUMMARY"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          for pair in "old ${REPO}:${previous}" "new ${REPO}@${new}"; do
            set -- ${pair}
            sudo podman pull -q "$2"
            printf '%s\n' "FROM $2" 'RUN systemctl enable sshd.service && mkdir -p /etc/containers/registries.conf.d && printf "[[registry]]\nlocation = \"%s\"\ninsecure = true\n" 127.0.0.1:5000 10.0.2.2:5000 > /etc/containers/registries.conf.d/50-vm-test.conf' |
              sudo podman build -q -t "localhost/vm-$1" -f - .
          done
          sudo podman run -d --name registry -p 127.0.0.1:5000:5000 docker.io/library/registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          sudo podman push -q --tls-verify=false localhost/vm-old 127.0.0.1:5000/arkadeos:test
          sudo podman push -q --tls-verify=false localhost/vm-old "127.0.0.1:5000/arkadeos:${previous}"

      - name: Disk image (previous build)
        if: steps.builds.outputs.skip != 'true'
        run: |
          ssh-keygen -q -t ed25519 -N '' -f vm-key
          sudo tests/vm/make-disk.sh /mnt/disk.raw localhost/vm-old "$PWD/vm-key.pub" \
            registry:127.0.0.1:5000/arkadeos:test 10.0.2.2:5000/arkadeos:test
          sudo chown "$USER" /mnt/disk.raw

      - name: Update to the new build
        if: steps.builds.outputs.skip != 'true'
        run: |
          tests/vm/update-path.sh /mnt/disk.raw vm-key vm-out \
            "sudo podman push -q --tls-verify=false localhost/vm-new 127.0.0.1:5000/arkadeos:test" \
            "${{ steps.builds.outputs.previous }}"

      - name: Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-test-update-path
          path: vm-out/
          if-no-files-found: ignore

  # The testing channel moves to a main build only once its VM test passed
  # (T081): machines on testing never get a build that failed it.
  testing:
    name: testing channel
    needs: [scope, vm-test, update-path]
    if: >-
      always() && needs.scope.outputs.skip != 'true' && startsWith(needs.scope.outputs.tag, 'build-') &&
      needs.vm-test.result == 'success' && (needs.update-path.result == 'success' || needs.update-path.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Move the testing tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.scope.outputs.tag }}
        run: |
          echo "$GITHUB_TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          digest=$(skopeo inspect --no-tags --format '{{ .Digest }}' "docker://ghcr.io/tenarkhq/arkadeos:${TAG}")
          # The former NVIDIA image's name gets the same build (T080).
          for name in arkadeos arkadeos-nvidia; do
            skopeo copy --retry-times 5 --retry-delay 10s --preserve-digests \
              "docker://ghcr.io/tenarkhq/arkadeos@${digest}" "docker://ghcr.io/tenarkhq/${name}:testing"
          done
          echo "testing → ${TAG} (${digest})" >> "$GITHUB_STEP_SUMMARY"

  # T048: a base update that passed every test goes to main, and main is built
  # at once as the next testing image.
  merge-base-update:
    name: base update to main
    needs: [vm-test, update-path]
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'base-update'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Merge and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view base-update -R "${GITHUB_REPOSITORY}" --json state --jq .state | grep -q OPEN; then
            gh pr merge base-update -R "${GITHUB_REPOSITORY}" --squash --delete-branch --match-head-commit "${GITHUB_SHA}"
          else
            # No pull request (see prefetch.yml): the tested commit itself.
            git push --atomic origin "${GITHUB_SHA}:refs/heads/main" ":refs/heads/base-update"
          fi
          gh workflow run build.yml -R "${GITHUB_REPOSITORY}" --ref main
