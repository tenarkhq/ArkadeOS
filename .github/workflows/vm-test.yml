name: VM test
on:
  workflow_run:
    workflows: [Build images]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to test"
        default: testing
        required: true

permissions:
  contents: read
  packages: read

jobs:
  vm-test:
    name: ${{ matrix.image }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # GitHub-hosted: these machines have KVM, the build server does not.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [arkadeos, arkadeos-nvidia]
    env:
      IMAGE: ghcr.io/tenarkhq/${{ matrix.image }}:${{ inputs.tag || 'testing' }}
    steps:
      - uses: actions/checkout@v4

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm || true
          grep -c -E 'vmx|svm' /proc/cpuinfo || true
          test -w /dev/kvm || { echo "no KVM on this runner" >&2; exit 1; }

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 ovmf socat imagemagick

      - name: Pull image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          start=$(date +%s)
          sudo podman pull -q "$IMAGE"
          echo "pull: $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"
          # The test reaches the VM over SSH, which ArkadeOS keeps off.
          printf 'FROM %s\nRUN systemctl enable sshd.service\n' "$IMAGE" | sudo podman build -q -t localhost/vm-test -f - .

      - name: Disk image
        run: |
          ssh-keygen -q -t ed25519 -N '' -f vm-key
          sudo truncate -s 60G /mnt/disk.raw
          start=$(date +%s)
          # The image installs itself, the same way a real install does.
          sudo podman run --rm --privileged --pid=host --security-opt label=type:unconfined_t \
            -v /dev:/dev -v /var/lib/containers:/var/lib/containers -v /mnt:/mnt \
            -v ./vm-key.pub:/vm-key.pub:ro \
            localhost/vm-test \
            bootc install to-disk --via-loopback --generic-image --wipe --filesystem btrfs \
              --root-ssh-authorized-keys /vm-key.pub /mnt/disk.raw
          sudo chown "$USER" /mnt/disk.raw
          echo "disk image: $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Boot, desktop, apps
        run: |
          start=$(date +%s)
          tests/vm/run.sh /mnt/disk.raw vm-key vm-out
          echo "VM test: $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-test-${{ matrix.image }}
          path: vm-out/
          if-no-files-found: ignore
