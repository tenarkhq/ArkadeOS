name: Build images
on:
  workflow_dispatch:
  schedule:
    # Daily, after the 01:30 UTC prefetch has pulled the newest Bazzite bases.
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "tools/prefetch.py"
      - ".github/workflows/prefetch.yml"
      - ".github/workflows/vm-test.yml"
      - ".github/workflows/promote.yml"
      - ".github/workflows/iso.yml"
      - "iso/**"
      - "tests/**"
      - "art/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/tenarkhq

jobs:
  build:
    name: arkadeos
    # Self-hosted build server. Only main, schedule and manual runs reach it
    # (the base-update branch is started by the prefetch), never pull
    # requests from forks.
    runs-on: [self-hosted, arkadeos-build]
    timeout-minutes: 180
    env:
      # One image for every graphics card (T080). It also goes out under the
      # former NVIDIA image's name, which machines installed before follow.
      IMAGE: arkadeos
      ALSO: arkadeos-nvidia
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: ver
        run: |
          base=$(awk -v i="${IMAGE}" '$1 == i { print $2 }' bases.txt)
          test -n "$base"
          podman pull -q "$base" >/dev/null
          base_version=$(podman image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$base")
          fedora=${base_version%%.*}
          # <Fedora>.<day> for the day's first build, then .1, .2 … for the
          # next ones (Roland, 2026-11-12: three builds of a day carried one
          # number), as Bazzite numbers its own. Counted from the
          # testing-<version> tags: every main build pushes one.
          day="${fedora}.$(date -u +%Y%m%d)"
          tags=$(skopeo list-tags --retry-times 5 "docker://${REGISTRY}/${IMAGE}")
          last=$(jq -r --arg day "${day}" '[.Tags[] | capture("^testing-(?<day>[0-9]+\\.[0-9]{8})(\\.(?<n>[0-9]+))?$")
            | select(.day == $day) | (.n // "0" | tonumber)] | max // -1' <<< "${tags}")
          if [ "${last}" -lt 0 ]; then version="${day}"; else version="${day}.$((last + 1))"; fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          proton_ge=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/GloriousEggroll/proton-ge-custom/releases/latest | jq -r .tag_name)
          echo "proton_ge=${proton_ge}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "${IMAGE} ${version} on ${base} (${base_version}), ${proton_ge}" >> "$GITHUB_STEP_SUMMARY"
          # The nightly build adds nothing when this commit is already built on
          # the same base and Proton-GE: no new version for the machines to
          # download (its VM test still runs every part, vm-test.yml).
          if [ "${GITHUB_EVENT_NAME}" = schedule ]; then
            labels=$(skopeo inspect --no-tags "docker://${REGISTRY}/${IMAGE}:build-${GITHUB_SHA}" 2>/dev/null | jq -c '.Labels // {}' || true)
            [ -n "${labels}" ] || labels='{}'
            if [ "$(jq -r '.["org.arkadeos.base"] // ""' <<< "${labels}")" = "${base}" ] &&
              [ "$(jq -r '.["org.arkadeos.proton-ge"] // ""' <<< "${labels}")" = "${proton_ge}" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Nothing changed since build-${GITHUB_SHA}: no new build." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Build
        if: steps.ver.outputs.skip != 'true'
        env:
          # Signs the drivers built in the image (Secure Boot); without it they
          # are built unsigned.
          MOK_KEY: ${{ secrets.MOK_KEY }}
        run: |
          args=(--build-arg BASE_IMAGE=${{ steps.ver.outputs.base }}
            --build-arg IMAGE_NAME=${IMAGE}
            --build-arg PROTON_GE_VERSION=${{ steps.ver.outputs.proton_ge }}
            --build-arg IMAGE_VERSION=${{ steps.ver.outputs.version }})
          [ -n "${MOK_KEY}" ] && args+=(--secret id=mok,env=MOK_KEY)
          podman build "${args[@]}" \
            --label org.opencontainers.image.title=ArkadeOS \
            --label org.opencontainers.image.description="Fast, gaming-first Linux built on Fedora Atomic" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.licenses=Apache-2.0 \
            --label org.opencontainers.image.version=${{ steps.ver.outputs.version }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.arkadeos.base=${{ steps.ver.outputs.base }} \
            --label org.arkadeos.proton-ge=${{ steps.ver.outputs.proton_ge }} \
            -t localhost/${IMAGE}:build \
            -f Containerfile .
          # The image goes out with the layers the Containerfile gives it
          # (T076). A machine downloads the packages layer again only when it
          # was built again, so the stages it and the layers above it come
          # from stay in the build server's cache under a name: the clean-up
          # below removes only what no name points at. Each of these builds
          # finds every step in the cache.
          for stage in solid packages proton initramfs; do
            podman build -q "${args[@]}" --target "${stage}" -t "localhost/${IMAGE}-cache:${stage}" -f Containerfile .
          done
          echo "layers: $(podman image inspect --format '{{ len .RootFS.Layers }}' localhost/${IMAGE}:build)" >> "$GITHUB_STEP_SUMMARY"

      - name: Push
        id: push
        if: steps.ver.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          dest=${REGISTRY}/${IMAGE}
          # main: the build's own tags; the testing channel moves to it only
          # after its VM test passed (vm-test.yml). Another branch
          # (base-update) only gets its own tag for its VM test.
          if [ "${GITHUB_REF_NAME}" = main ]; then
            first=build-${GITHUB_SHA} more="testing-${{ steps.ver.outputs.version }} sha-${GITHUB_SHA::7}"
          else
            first=branch-${GITHUB_SHA} more=
          fi
          podman push --retry 3 --digestfile digest localhost/${IMAGE}:build docker://${dest}:${first}
          digest=$(cat digest)
          # What a machine on the testing build downloads for this one: the
          # layers it does not have yet (T076).
          skopeo inspect --raw "docker://${dest}@${digest}" > new.json
          skopeo inspect --raw "docker://${dest}:testing" > old.json 2>/dev/null || echo '{}' > old.json
          jq -rn --slurpfile new new.json --slurpfile old old.json '
            ($old[0].layers // [] | map(.digest)) as $have
            | [$new[0].layers[] | select(.digest as $d | $have | index($d) | not)] as $fresh
            | "update from the testing build: \($fresh | length) of \($new[0].layers | length) layers, "
              + "\(($fresh | map(.size) | add // 0) / 1048576 | round) MB to download"' >> "$GITHUB_STEP_SUMMARY"
          for tag in ${more}; do
            # A new GHCR package can take a few seconds to serve its first manifest.
            skopeo copy --retry-times 5 --retry-delay 10s --preserve-digests docker://${dest}@${digest} docker://${dest}:${tag}
          done
          for tag in ${first} ${more}; do
            skopeo copy --retry-times 5 --retry-delay 10s --preserve-digests docker://${dest}@${digest} docker://${REGISTRY}/${ALSO}:${tag}
          done
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "pushed ${dest}@${digest} (also ${ALSO}): ${first} ${more}" >> "$GITHUB_STEP_SUMMARY"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.ver.outputs.skip != 'true'
        with:
          cosign-release: v3.1.4

      - name: Sign
        if: steps.ver.outputs.skip != 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for name in "${IMAGE}" "${ALSO}"; do
            cosign sign -y --key env://COSIGN_PRIVATE_KEY \
              --new-bundle-format=false --use-signing-config=false \
              --registry-username "${{ github.actor }}" --registry-password "$GITHUB_TOKEN" \
              ${REGISTRY}/${name}@${{ steps.push.outputs.digest }}
            cosign verify --key cosign.pub ${REGISTRY}/${name}@${{ steps.push.outputs.digest }} >/dev/null
          done

      - name: Clean up
        if: always()
        run: |
          podman logout ghcr.io || true
          podman rmi -f localhost/${IMAGE}:build || true
          # The stages kept under a name (Build) stay as the next build's
          # cache; the ones a newer build replaced go after three days.
          podman image prune -f --filter until=72h

  # A branch build (base-update) is VM-tested here; main builds start the VM
  # test through its workflow_run trigger.
  vm-test:
    needs: build
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the VM test
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run vm-test.yml -R "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}" -f tag="branch-${GITHUB_SHA}"
