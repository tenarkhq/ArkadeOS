name: Prefetch build inputs

# Keeps the newest base images and app downloads on the build server, so
# image builds do not wait for downloads. Runs only on the self-hosted build
# runner, by hand or nightly; never on pull requests.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: prefetch
  cancel-in-progress: false

jobs:
  prefetch:
    runs-on: [self-hosted, arkadeos-build]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Base images
        run: |
          for i in bazzite bazzite-nvidia bazzite-nvidia-open; do
            podman pull -q ghcr.io/ublue-os/$i:stable
          done
          podman image prune -f
          mkdir -p ~/arkadeos-cache
          podman images --format '{{.Repository}}:{{.Tag}} {{.Size}} {{.Created}}' | tee ~/arkadeos-cache/images.txt

      - name: Base image contents
        run: |
          # Package and service lists of each base, for the cleanup list (T002)
          # and for spotting what a Bazzite update changed (T048).
          out=~/arkadeos-cache/bases
          mkdir -p "$out"
          for i in bazzite bazzite-nvidia bazzite-nvidia-open; do
            podman run --rm ghcr.io/ublue-os/$i:stable bash -c '
              rpm -qa --qf "%{NAME}\t%{VERSION}-%{RELEASE}\t%{SIZE}\t%{SUMMARY}\n" | sort
            ' > "$out/$i.packages.tsv"
            podman run --rm ghcr.io/ublue-os/$i:stable bash -c '
              systemctl list-unit-files --no-legend --no-pager --state=enabled,static,indirect --type=service,socket,timer,path
              echo "--- user"
              systemctl --global list-unit-files --no-legend --no-pager --state=enabled --type=service,socket,timer
              echo "--- flatpak preinstall"
              cat /usr/share/ublue-os/bazzite/flatpak/install 2>/dev/null || true
            ' > "$out/$i.units.txt"
            wc -l "$out/$i.packages.tsv"
          done

      - name: Apps, themes, installers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/prefetch.py

      - name: Fedora packages (COPR)
        run: |
          # Packages the Bazzite base lacks, resolved against the base's own Fedora
          out=~/arkadeos-cache/rpms/asus
          rm -rf "$out.new" && mkdir -p "$out.new"
          podman run --rm -v "$out.new":/out ghcr.io/ublue-os/bazzite:stable bash -c '
            dnf5 -y -q copr enable lukenukem/asus-linux &&
            dnf5 -q download --arch x86_64 --arch noarch --destdir /out asusctl supergfxctl &&
            { dnf5 -q download --arch x86_64 --arch noarch --destdir /out asusctl-rog-gui || echo "asusctl-rog-gui: not in the repo"; }'
          rm -rf "$out" && mv "$out.new" "$out"
          ls -1 "$out"

      # T048: the pinned bases follow Bazzite. A new base (kernel, Mesa, NVIDIA
      # driver) becomes a pull request from the base-update branch; that branch
      # is built and VM-tested (build.yml, vm-test.yml), and a passing test
      # merges it. The next main build is the testing image, and promote.yml
      # takes it to stable once it has passed and been on testing for three days.
      - name: Base update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/bump-bases.sh
          git diff --quiet bases.txt && exit 0
          changes=$(tools/base-changes.sh)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B base-update
          git commit -q -F - bases.txt <<MSG
          Base update: newest Bazzite

          ${changes:-No kernel, Mesa or NVIDIA driver change.}
          MSG
          git push -q -f origin base-update
          api=https://api.github.com/repos/${GITHUB_REPOSITORY}
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          body=$(jq -n --arg c "${changes:-No kernel, Mesa or NVIDIA driver change.}" \
            '{title: "Base update: newest Bazzite", head: "base-update", base: "main",
              body: ("```\n" + $c + "\n```\n\nBuilt and VM-tested from this branch; merged by itself when the test passes.")}')
          open=$(curl -fsS "${auth[@]}" "${api}/pulls?head=${GITHUB_REPOSITORY_OWNER}:base-update&state=open" | jq length)
          # Opening it needs "Allow GitHub Actions to create pull requests" in the
          # repository settings; without it the branch is still tested and merged.
          if [ "${open}" = 0 ]; then
            curl -fsS "${auth[@]}" -X POST "${api}/pulls" -d "${body}" | jq -r .html_url ||
              echo "::warning::No pull request: Actions may not open one in this repository"
          fi
          curl -fsS "${auth[@]}" -X POST "${api}/actions/workflows/build.yml/dispatches" -d '{"ref":"base-update"}'
          { echo "### Base update (pull request from base-update)"; echo '```'; echo "${changes}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache size
        if: always()
        run: du -sh ~/arkadeos-cache ~/.local/share/containers 2>/dev/null || true
