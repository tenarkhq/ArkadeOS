name: Prefetch build inputs

# Keeps the newest base images and app downloads on the build server, so
# image builds do not wait for downloads. Runs only on the self-hosted build
# runner, by hand or nightly; never on pull requests.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: read

concurrency:
  group: prefetch
  cancel-in-progress: false

jobs:
  prefetch:
    runs-on: [self-hosted, arkadeos-build]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Base images
        run: |
          for i in bazzite bazzite-nvidia bazzite-nvidia-open; do
            podman pull -q ghcr.io/ublue-os/$i:stable
          done
          podman image prune -f
          mkdir -p ~/arkadeos-cache
          podman images --format '{{.Repository}}:{{.Tag}} {{.Size}} {{.Created}}' | tee ~/arkadeos-cache/images.txt

      - name: Apps, themes, installers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/prefetch.py

      - name: Fedora packages (COPR)
        run: |
          # Packages the Bazzite base lacks, resolved against the base's own Fedora
          out=~/arkadeos-cache/rpms/asus
          rm -rf "$out.new" && mkdir -p "$out.new"
          podman run --rm -v "$out.new":/out ghcr.io/ublue-os/bazzite:stable bash -c '
            dnf5 -y -q copr enable lukenukem/asus-linux &&
            dnf5 -q download --arch x86_64 --arch noarch --destdir /out asusctl supergfxctl &&
            { dnf5 -q download --arch x86_64 --arch noarch --destdir /out asusctl-rog-gui || echo "asusctl-rog-gui: not in the repo"; }'
          rm -rf "$out" && mv "$out.new" "$out"
          ls -1 "$out"

      - name: Cache size
        if: always()
        run: du -sh ~/arkadeos-cache ~/.local/share/containers 2>/dev/null || true
