    <radialGradient id="glow" cx="48" cy="48" r="48" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#60aae8" stop-opacity="0.85"/>
      <stop offset="0.72" stop-color="#60aae8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#60aae8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="30" fill="url(#glow)"/>
  <g transform="translate(13.5 13.5) scale(.72)">
