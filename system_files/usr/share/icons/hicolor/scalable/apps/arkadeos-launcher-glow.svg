    <path d="M48 48L28 28" stroke="#F4F4F6" stroke-width="5" stroke-linecap="round"/>
    <circle cx="28" cy="28" r="6" fill="#22C55E"/>
    <path d="M48 48L68 28" stroke="#F4F4F6" stroke-width="5" stroke-linecap="round"/>
    <circle cx="68" cy="28" r="6" fill="#F59E0B"/>
    <path d="M48 48L28 68" stroke="#F4F4F6" stroke-width="5" stroke-linecap="round"/>
    <circle cx="28" cy="68" r="6" fill="#C9CCF2"/>
    <path d="M48 48L68 68" stroke="#F4F4F6" stroke-width="5" stroke-linecap="round"/>
    <circle cx="68" cy="68" r="6" fill="#F43F5E"/>
    <circle cx="48" cy="48" r="8" fill="#F4F4F6"/>
