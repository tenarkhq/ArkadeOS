<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="ArkadeOS">
  <!-- ArkadeOS Glass (T086): the ArkadeOS launcher mark on its dark tile, lit
       by a glow in the glass colour around it, as in Roland's design. -->
