# Memory under pressure (T084). Swap is compressed memory here (zram), so
# packing an idle program's pages costs little, and a game's files stay in the
# cache: the values zram-generator's own documentation gives for it. The
# kernel also starts freeing memory in the background earlier, before a
# program has to wait for it.
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
