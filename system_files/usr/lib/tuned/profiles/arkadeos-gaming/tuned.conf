# ArkadeOS Gaming (T011): while a game runs. Performance CPU with boost, the
# scheduler in gaming mode (Bazzite's base), performance platform profile so
# the firmware lets the GPU and CPU draw more power.
[main]
summary=ArkadeOS gaming: while a game runs
include=throughput-performance-bazzite

[cpu]
governor=performance
energy_performance_preference=performance
energy_perf_bias=performance
boost=1
no_turbo=0

[acpi]
platform_profile=performance|balanced-performance|balanced

# AMD X3D processors (T052): games on the cores with the extra 3D V-cache.
# Its own script instance, so Bazzite's scheduler script still runs.
[x3d]
type=script
script=${i:PROFILE_DIR}/x3d.sh

# No power saving anywhere (T058): Wi-Fi, Ethernet, PCIe, USB, SATA, sound.
# The CPU's idle states stay: Ryzen and Intel boost a busy core higher while
# the others sleep (Max turns them off).
[nopowersave]
type=script
script=${i:PROFILE_DIR}/no-power-save.sh

# Memory (T084). Games get huge pages without asking for them, so the
# processor looks up fewer addresses in a big game; the kernel's default gives
# them only to programs that ask, and Windows games do not. The base profile
# under this one is made for servers: its write buffer of 40% of the memory
# holds gigabytes back and then writes them at once, so here data goes to the
# disk early and evenly; its swappiness of 10 drops a game's files from the
# cache before an idle program's memory is packed, so ArkadeOS's own value
# stays (71-arkadeos-memory.conf).
[vm]
transparent_hugepages=always
dirty_bytes=268435456
dirty_background_bytes=67108864

[sysctl]
drop=vm.swappiness
kernel.nmi_watchdog=0

# The laptop maker's own modes (T046, T047).
[vendor]
type=script
script=${i:PROFILE_DIR}/vendor.sh
