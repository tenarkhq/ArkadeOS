# ArkadeOS WoW (T055): for CPU-bound games such as World of Warcraft. Gaming
# for the processor (performance, boost, X3D cores), while the graphics card
# runs held back, so the laptop's shared power and cooling go to the CPU.
[main]
summary=ArkadeOS WoW: full CPU, held-back GPU
include=arkadeos-gaming

# The laptop maker's own modes (T046, T047).
[vendor]
type=script
script=${i:PROFILE_DIR}/vendor.sh

# The graphics card at most a share of its full speed (gpu-cap).
[gpucap]
type=script
script=/usr/libexec/arkadeos/gpu-cap
