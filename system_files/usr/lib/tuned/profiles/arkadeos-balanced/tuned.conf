# ArkadeOS Kiegyensúlyozott (T011): the default on the charger.
[main]
summary=ArkadeOS balanced: the default on the charger
include=balanced-bazzite

[cpu]
energy_performance_preference=balance_performance
boost=1
no_turbo=0

[acpi]
platform_profile=balanced

# On the charger only the processor runs balanced; power is saved in Akku
# alone (T058). The sound chip, the SATA and PCIe links, Wi-Fi, Ethernet and
# USB devices stay awake as in Gaming. PCI devices keep their own power
# management here, so a graphics card nothing uses still sleeps on a laptop
# in hybrid mode.
[audio]
timeout=0

[scsi_host]
alpm=max_performance

[nopowersave]
type=script
script=${i:PROFILE_DIR}/no-power-save.sh

# The laptop maker's own modes (T046, T047).
[vendor]
type=script
script=${i:PROFILE_DIR}/vendor.sh
