# ArkadeOS Akku (T011): longest battery life. Saving CPU, no boost, deep
# C-states allowed, quiet platform profile; Bazzite's base turns on USB, Wi-Fi
# and panel power saving and puts the scheduler in power-save mode.
[main]
summary=ArkadeOS battery: longest battery life
include=powersave-battery-bazzite

[cpu]
governor=powersave
energy_performance_preference=power
energy_perf_bias=power
boost=0
no_turbo=1

[acpi]
platform_profile=low-power|quiet|balanced

# The laptop maker's own modes (T046, T047).
[vendor]
type=script
script=${i:PROFILE_DIR}/vendor.sh
