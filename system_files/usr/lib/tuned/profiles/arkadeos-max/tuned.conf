# ArkadeOS Max (T011): chosen by hand, only on the charger. Gaming plus deep
# C-states off; the performance platform profile also runs the fans at their
# highest curve.
[main]
summary=ArkadeOS max: by hand, on the charger only
include=arkadeos-gaming

[cpu]
force_latency=cstate.id_no_zero:1|3

# The laptop maker's own modes (T046, T047).
[vendor]
type=script
script=${i:PROFILE_DIR}/vendor.sh

# Lenovo Legion and others: their highest firmware mode where there is one.
[acpi]
platform_profile=max-power|performance|balanced-performance|balanced
