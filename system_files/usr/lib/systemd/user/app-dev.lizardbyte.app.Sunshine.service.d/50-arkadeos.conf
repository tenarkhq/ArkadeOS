# Sunshine 2026.914 starts listening for the desktop's answer only after it
# asked for the screen share, so now and then it misses the answer and waits
# for good: its page never comes up. Not up in 90 seconds → started again.
[Unit]
StartLimitIntervalSec=900
StartLimitBurst=5

[Service]
ExecStartPost=/usr/libexec/arkadeos/sunshine-up
TimeoutStartSec=150
Restart=on-failure
RestartSec=2
