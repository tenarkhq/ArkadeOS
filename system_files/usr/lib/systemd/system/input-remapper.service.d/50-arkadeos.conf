# T050: the key remapper's service starts at boot only where a user has made
# a preset. Its window starts it by itself when a first preset is made. While
# it runs /run/input-remapper is there, which its udev rule looks for
# (50-services.sh).
[Unit]
ConditionPathExistsGlob=/var/home/*/.config/input-remapper-2/presets/*/*.json

[Service]
RuntimeDirectory=input-remapper
