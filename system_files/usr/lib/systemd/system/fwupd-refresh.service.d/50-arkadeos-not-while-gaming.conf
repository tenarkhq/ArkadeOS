# T050: the firmware list is not fetched while a game runs (no-game-running):
# the fwupd daemon starts for it and goes through the devices. The timer
# tries again the next day. With full rights (+): the service's sandbox hides
# /run/user, where the game watcher's mark is.
[Service]
ExecCondition=+/usr/libexec/arkadeos/no-game-running
