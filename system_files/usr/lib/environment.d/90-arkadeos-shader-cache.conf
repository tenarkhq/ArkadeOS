# Shader caches big enough for every game (T057). Battle.net games (WoW) are
# no Steam games, so only the driver's own cache keeps their compiled shaders;
# when it is full, old ones are dropped and the stutter comes back.
# NVIDIA: 12 GB, never trimmed. AMD and Intel (Mesa): 12 GB.
__GL_SHADER_DISK_CACHE_SIZE=12000000000
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1
MESA_SHADER_CACHE_MAX_SIZE=12G
