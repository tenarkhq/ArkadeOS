# ArkadeOS boot menu colours (T009): light text on black, like the boot screen.
set color_normal=light-gray/black
set color_highlight=black/light-gray
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-gray
# Its look (T009), put on /boot by arkadeos-windows-entry; the colours above stay
# for a screen GRUB cannot draw pictures on.
if [ -f $prefix/themes/arkadeos/theme.txt ]; then
  load_video
  insmod gfxterm
  insmod png
  set gfxmode=auto
  terminal_output gfxterm
  loadfont $prefix/themes/arkadeos/inter-20.pf2
  loadfont $prefix/themes/arkadeos/inter-24.pf2
  set theme=$prefix/themes/arkadeos/theme.txt
  export theme
fi
# T023: with Windows in the menu (custom.cfg) there are 5 seconds to choose.
if [ -f $prefix/custom.cfg ]; then
  set timeout=5
fi
