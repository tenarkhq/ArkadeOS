# ArkadeOS power profiles (T011) behind the standard power profile switch
# (Plasma's battery applet, powerprofilesctl). On battery Balanced becomes
# Akku by itself; Gaming is held while a game runs (arkadeos-game-profile).
# Max is not a standard profile: arkadeos-power sets it.
[main]
default=balanced
battery_detection=true
sysfs_acpi_monitor=true

[profiles]
power-saver=arkadeos-battery
balanced=arkadeos-balanced
performance=arkadeos-gaming

[battery]
power-saver=arkadeos-battery
balanced=arkadeos-battery-auto
